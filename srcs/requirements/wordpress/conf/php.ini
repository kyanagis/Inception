expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M
max_execution_time = 120
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
cgi.fix_pathinfo = 0
