name: Build Inception OVA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ova-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Inception
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Run NixOS integration tests
        run: nix flake check path:. -L --show-trace

  ova:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout Inception
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Build OVA
        run: nix build path:.#packages.x86_64-linux.vbox -o result-vbox --print-build-logs

      - name: Find OVA
        id: ova
        shell: bash
        run: |
          set -euo pipefail
          ova="$(find -L result-vbox -type f -name '*.ova' -print -quit)"
          test -n "$ova"
          echo "path=$ova" >> "$GITHUB_OUTPUT"

      - name: Validate OVA manifest and VirtualBox import
        shell: bash
        run: |
          set -euo pipefail
          inspect="$RUNNER_TEMP/ova-inspect"
          mkdir -p "$inspect"
          tar -xf "${{ steps.ova.outputs.path }}" -C "$inspect"
          manifest="$(find "$inspect" -maxdepth 1 -type f -name '*.mf' -print -quit)"
          test -n "$manifest"
          verified=0
          while IFS= read -r raw || [[ -n "$raw" ]]; do
            printf 'manifest-entry=%q\n' "$raw"
            line="$(printf '%s' "$raw" | tr -d '\015')"
            [[ -z "$line" ]] && continue

            if [[ "$line" =~ ^([[:alnum:]-]+)[[:space:]]*\((.*)\)[[:space:]]*=[[:space:]]*([[:xdigit:]]+)$ ]]; then
              algorithm="${BASH_REMATCH[1]}"
              file="${BASH_REMATCH[2]}"
              expected="${BASH_REMATCH[3],,}"
            else
              echo "Unsupported OVA manifest entry: $line" >&2
              exit 1
            fi

            case "${algorithm^^}" in
              SHA1|SHA-1)
                actual="$(sha1sum "$inspect/$file" | awk '{print $1}')"
                ;;
              SHA256|SHA-256)
                actual="$(sha256sum "$inspect/$file" | awk '{print $1}')"
                ;;
              SHA512|SHA-512)
                actual="$(sha512sum "$inspect/$file" | awk '{print $1}')"
                ;;
              *)
                echo "Unsupported digest algorithm in OVA manifest: $algorithm" >&2
                exit 1
                ;;
            esac

            if [[ "${actual,,}" != "$expected" ]]; then
              echo "OVA manifest mismatch for $file ($algorithm)" >&2
              echo "expected=$expected" >&2
              echo "actual=${actual,,}" >&2
              exit 1
            fi
            echo "Verified OVA manifest entry: $file ($algorithm)"
            verified=1
          done < "$manifest"
          test "$verified" -eq 1
          nix build path:.#packages.x86_64-linux.ova-import-check -L
      - name: Split and verify OVA
        shell: bash
        run: |
          set -euo pipefail
          split -b 1900M -d -a 2 "${{ steps.ova.outputs.path }}" inception.ova.part-
          sha256sum inception.ova.part-* > SHA256SUMS
          sha256sum "${{ steps.ova.outputs.path }}" \
            | awk '{print $1 "  inception.ova"}' >> SHA256SUMS
          expected="$(awk '$2 == "inception.ova" {print $1}' SHA256SUMS)"
          actual="$(cat inception.ova.part-* | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Record build provenance
        shell: bash
        run: |
          set -euo pipefail
          submit_commit="$(sed -n 's/^Submit commit: //p' nix/config/RELEASE-METADATA.txt)"
          test -n "$submit_commit"
          remote_submit="$(git ls-remote https://github.com/kyanagis/Inception.git refs/heads/submit | awk '{print $1}')"
          test "$remote_submit" = "$submit_commit"
          {
            echo "OVA source commit: $GITHUB_SHA"
            echo "Submit commit: $submit_commit"
            echo "Flake lock SHA-256: $(sha256sum flake.lock | awk '{print $1}')"
            echo "Runner OS: $(. /etc/os-release && echo "$PRETTY_NAME")"
          } > BUILD-PROVENANCE.txt

      - name: Upload OVA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inception-ova
          path: |
            inception.ova.part-*
            SHA256SUMS
            BUILD-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ova
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified OVA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inception-ova
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="$GITHUB_REF_NAME"
          assets=(release-assets/SHA256SUMS release-assets/BUILD-PROVENANCE.txt release-assets/inception.ova.part-*)
          if gh release view "$release_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; refusing to overwrite it" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          Reproducible NixOS VirtualBox appliance for the Inception project.

          $(cat release-assets/BUILD-PROVENANCE.txt)

          Requirements: VirtualBox 7.x, x86_64 CPU, 4 GiB RAM, and at least 35 GiB free disk space.

          Join the parts and verify the combined image:

              cat inception.ova.part-* > inception.ova
              sha256sum --check --ignore-missing SHA256SUMS

          The appliance does not contain the assessed project source. Follow the guides on its Desktop and clone the exact submit branch commit recorded above.
          EOF
          gh release create "$release_tag" "${assets[@]}" \
            --repo "$GH_REPO" --title "$release_tag" --notes-file release-notes.md --verify-tag
