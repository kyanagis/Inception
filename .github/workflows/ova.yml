name: Build Inception OVA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ova-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ova:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout Inception
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Build OVA
        run: nix build path:.#packages.x86_64-linux.vbox -o result-vbox --print-build-logs

      - name: Find OVA
        id: ova
        shell: bash
        run: |
          set -euo pipefail
          ova="$(find -L result-vbox -type f -name '*.ova' -print -quit)"
          test -n "$ova"
          echo "path=$ova" >> "$GITHUB_OUTPUT"

      - name: Split and verify OVA
        shell: bash
        run: |
          set -euo pipefail
          split -b 1900M "${{ steps.ova.outputs.path }}" inception.ova.part-
          sha256sum "${{ steps.ova.outputs.path }}" \
            | awk '{print $1 "  inception.ova"}' > inception.ova.sha256
          expected="$(awk '{print $1}' inception.ova.sha256)"
          actual="$(cat inception.ova.part-* | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Upload OVA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inception-ova
          path: |
            inception.ova.part-*
            inception.ova.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ova
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified OVA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inception-ova
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(release-assets/inception.ova.sha256 release-assets/inception.ova.part-*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
