name: Build Universal Inception OVA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/ova.yml"

concurrency:
  group: ova-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout OVA source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11
      - name: Run NixOS integration tests
        run: nix flake check path:. -L --show-trace

  submit-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      submit_sha: ${{ steps.submit-meta.outputs.submit_sha }}
    steps:
      - name: Checkout current submit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: submit
          path: submit
          persist-credentials: false
      - name: Record submit revision
        id: submit-meta
        shell: bash
        run: echo "submit_sha=$(git -C submit rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare isolated Docker data-root
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop docker.service docker.socket || true
          sudo install -d -o root -g root -m 0710 /home/runner/data/docker
          config="$(sudo cat /etc/docker/daemon.json 2>/dev/null || printf '{}')"
          printf '%s' "$config" | jq --arg root /home/runner/data/docker '. + {"data-root": $root}' |
            sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker.socket docker.service
          for attempt in $(seq 1 60); do
            if root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null)" &&
               [ "$root" = /home/runner/data/docker ]; then
              break
            fi
            sleep 1
          done
          test "$(docker info --format '{{.DockerRootDir}}')" = /home/runner/data/docker
          printf '127.0.0.1 runner.42.fr\n' | sudo tee -a /etc/hosts >/dev/null
      - name: Validate current submit clone-and-make contract
        shell: bash
        working-directory: submit
        env:
          INCEPTION_LOGIN: runner
        run: |
          set -euo pipefail
          test ! -e srcs/.env
          make
          test -f srcs/.env
          make test
          make audit
      - name: Validate current submit stable evaluation ABI
        shell: bash
        working-directory: submit
        env:
          INCEPTION_LOGIN: runner
        run: |
          set -euo pipefail
          sh ./.inception/evaluate full
      - name: Capture service evidence
        if: always()
        shell: bash
        working-directory: submit
        run: |
          docker compose --env-file srcs/.env -f srcs/docker-compose.yml --profile bonus ps || true
          docker ps --filter label=com.docker.compose.project=inception --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker info --format 'DockerRootDir={{.DockerRootDir}}' || true
      - name: Clean integration stack
        if: always()
        shell: bash
        working-directory: submit
        run: docker compose --env-file srcs/.env -f srcs/docker-compose.yml --profile bonus down --volumes --remove-orphans || true

  ova:
    needs:
      - check
      - submit-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout OVA source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11
      - name: Build OVA
        run: nix build path:.#packages.x86_64-linux.vbox -o result-vbox --print-build-logs
      - name: Find OVA
        id: ova
        shell: bash
        run: |
          set -euo pipefail
          ova="$(find -L result-vbox -type f -name '*.ova' -print -quit)"
          test -n "$ova"
          echo "path=$ova" >> "$GITHUB_OUTPUT"
      - name: Validate OVA manifest and VirtualBox import
        shell: bash
        run: |
          set -euo pipefail
          inspect="$RUNNER_TEMP/ova-inspect"
          mkdir -p "$inspect"
          tar -xf "${{ steps.ova.outputs.path }}" -C "$inspect"
          manifest="$(find "$inspect" -maxdepth 1 -type f -name '*.mf' -print -quit)"
          test -n "$manifest"
          verified=0
          while IFS= read -r raw || [[ -n "$raw" ]]; do
            printf 'manifest-entry=%q\n' "$raw"
            line="$(printf '%s' "$raw" | tr -d '\015')"
            [[ -z "$line" ]] && continue
            if [[ "$line" =~ ^([[:alnum:]-]+)[[:space:]]*\((.*)\)[[:space:]]*=[[:space:]]*([[:xdigit:]]+)$ ]]; then
              algorithm="${BASH_REMATCH[1]}"
              file="${BASH_REMATCH[2]}"
              expected="${BASH_REMATCH[3],,}"
            else
              echo "Unsupported OVA manifest entry: $line" >&2
              exit 1
            fi
            case "${algorithm^^}" in
              SHA1|SHA-1) actual="$(sha1sum "$inspect/$file" | awk '{print $1}')" ;;
              SHA256|SHA-256) actual="$(sha256sum "$inspect/$file" | awk '{print $1}')" ;;
              SHA512|SHA-512) actual="$(sha512sum "$inspect/$file" | awk '{print $1}')" ;;
              *) echo "Unsupported digest algorithm: $algorithm" >&2; exit 1 ;;
            esac
            test "${actual,,}" = "$expected" || {
              echo "OVA manifest mismatch for $file ($algorithm)" >&2
              echo "expected=$expected" >&2
              echo "actual=${actual,,}" >&2
              exit 1
            }
            verified=1
          done < "$manifest"
          test "$verified" -eq 1
          nix build path:.#packages.x86_64-linux.ova-import-check -L
      - name: Split and verify OVA
        shell: bash
        run: |
          set -euo pipefail
          split -b 1900M -d -a 2 "${{ steps.ova.outputs.path }}" inception.ova.part-
          sha256sum inception.ova.part-* > SHA256SUMS
          sha256sum "${{ steps.ova.outputs.path }}" |
            awk '{print $1 "  inception.ova"}' >> SHA256SUMS
          expected="$(awk '$2 == "inception.ova" {print $1}' SHA256SUMS)"
          actual="$(cat inception.ova.part-* | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Record build provenance
        shell: bash
        env:
          TESTED_SUBMIT_SHA: ${{ needs.submit-compatibility.outputs.submit_sha }}
        run: |
          set -euo pipefail
          {
            echo "OVA source commit: $GITHUB_SHA"
            echo "Compatibility-tested submit commit: $TESTED_SUBMIT_SHA"
            echo "Runtime submit policy: refs/heads/submit (not pinned)"
            echo "Flake lock SHA-256: $(sha256sum flake.lock | awk '{print $1}')"
            echo "Runner OS: $(. /etc/os-release && echo "$PRETTY_NAME")"
          } > BUILD-PROVENANCE.txt
          cat > OVA-CAPABILITIES.txt <<'EOF'
          Universal Inception x86_64 OVA
          - import once into VirtualBox; ordinary submit changes do not require re-export
          - clone current submit and run make; runtime env is generated automatically
          - submit source is fetched at runtime and is not baked into the image
          - named-volume Mountpoints are exposed exactly below /home/<42-login>/data/docker
          - host ABI 7: existing appliances self-update this storage-path contract before make
          - bootstrap instructions clone the assessed repository into a new empty directory
          - inception-host-update: self-update the NixOS guest from current main
          - inception-evaluate: update/prepare/mandatory/bonus/full/audit modes
          - inception-audit: host and repository hypothesis-driven audit
          - Docker + Compose
          - jq, Python, C/C++ build tools, gdb, strace, shellcheck
          - nmap, tcpdump, socat, iproute2
          - git, ripgrep, rsync, tmux, htop/btop/ncdu
          - Firefox, VSCodium, Meld, Kitty, Vim
          - Xfce Terminal + Mousepad with validated desktop launchers/default associations
          - GUI configuration is installed before the display manager starts
          - dynamic .inception/host-tools -> ephemeral Nix shell fallback
          EOF
      - name: Upload verified OVA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: inception-universal-ova
          path: |
            inception.ova.part-*
            SHA256SUMS
            BUILD-PROVENANCE.txt
            OVA-CAPABILITIES.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - ova
      - submit-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified OVA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: inception-universal-ova
          path: release-assets
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SUBMIT_SHA: ${{ needs.submit-compatibility.outputs.submit_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            release_tag=ova-latest
            release_title="Inception Universal OVA（最新版）"
          else
            release_tag="$GITHUB_REF_NAME"
            release_title="$release_tag"
            if gh release view "$release_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "Versioned release $release_tag already exists; refusing to overwrite it" >&2
              exit 1
            fi
          fi
          assets=(
            release-assets/SHA256SUMS
            release-assets/BUILD-PROVENANCE.txt
            release-assets/OVA-CAPABILITIES.txt
            release-assets/inception.ova.part-*
          )
          cat > release-notes.md <<EOF
          42 Inceptionの評価用に作った x86_64 NixOS / VirtualBoxアプライアンスです。

          このOVAには評価対象のsourceは入れてません。
          VirtualBoxへimportしたあと、自分の42 loginを設定してcurrent `submit`をcloneし、`make`してください。

          ```bash
          inception-setup YOUR_42_LOGIN

          mkdir ~/inception-evaluation
          cd ~/inception-evaluation
          git clone --branch submit --single-branch \
            https://github.com/kyanagis/Inception.git Inception

          cd Inception
          make
          make test
          ```

          評価シートに従いclone先は新規の空ディレクトリです。`/home/YOUR_42_LOGIN/data`は
          WordPress/MariaDBの永続データ専用で、Docker volume inspectでもこのパス以下が表示されます。

          通常の`submit`変更ではOVAを焼き直す必要はありません。
          project固有の処理は`submit/.inception/evaluate`側に置き、userspace tool不足はNix、host capability不足は`inception-host-update`で追従できるようにしています。

          このreleaseの検証情報:

          - OVA source: `$GITHUB_SHA`
          - build時に互換性確認したsubmit: `$TESTED_SUBMIT_SHA`
          - x86_64 / 4 vCPU / RAM 4 GiB
          - Xfce GUI
          - Xfce Terminal / Mousepad
          - VirtualBox import検証
          - OVA manifest / SHA-256 / provenance検証
          - release後smokeで実disk boot、current submitのmandatory/bonus/reboot永続化を検証

          必要環境:

          - VirtualBox 7.x
          - x86_64 CPU
          - RAM 4 GiB以上
          - 空き容量 35 GiB以上

          OVAはGitHub Releaseの容量制限のため分割しています。

          ```bash
          cat inception.ova.part-* > inception.ova
          sha256sum --check --ignore-missing SHA256SUMS
          ```

          `inception.ova: OK` が出たら、生成された`inception.ova`をVirtualBoxへimportしてください。
          EOF
          if [ "$GITHUB_REF" = refs/heads/main ] && gh release view "$release_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            stage_prefix="staged-$GITHUB_RUN_ID-"
            backup_prefix="backup-$GITHUB_RUN_ID-"
            mkdir -p release-staging

            declare -a staged_names=()
            for asset in "${assets[@]}"; do
              base="$(basename "$asset")"
              staged_name="$stage_prefix$base"
              cp "$asset" "release-staging/$staged_name"
              gh release upload "$release_tag" "release-staging/$staged_name" --repo "$GH_REPO"
              staged_names+=("$staged_name")

              expected_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
              remote_digest="$(gh api "repos/$GH_REPO/releases/tags/$release_tag" \
                --jq ".assets[] | select(.name == \"$staged_name\") | .digest")"
              [ "$remote_digest" = "$expected_digest" ] || {
                echo "Staged asset digest mismatch for $base" >&2
                exit 1
              }
            done

            # Keep the previous published assets as backups until the new set,
            # tag and notes have all been verified.
            for asset in "${assets[@]}"; do
              base="$(basename "$asset")"
              old_id="$(gh api "repos/$GH_REPO/releases/tags/$release_tag" \
                --jq ".assets[] | select(.name == \"$base\") | .id" | head -n 1)"
              if [ -n "$old_id" ]; then
                gh api --method PATCH "repos/$GH_REPO/releases/assets/$old_id" \
                  -f name="$backup_prefix$base" >/dev/null
              fi

              staged_name="$stage_prefix$base"
              staged_id="$(gh api "repos/$GH_REPO/releases/tags/$release_tag" \
                --jq ".assets[] | select(.name == \"$staged_name\") | .id")"
              [ -n "$staged_id" ]
              gh api --method PATCH "repos/$GH_REPO/releases/assets/$staged_id" \
                -f name="$base" >/dev/null
            done

            if gh api "repos/$GH_REPO/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$release_tag" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            else
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f ref="refs/tags/$release_tag" -f sha="$GITHUB_SHA" >/dev/null
            fi
            gh release edit "$release_tag" --repo "$GH_REPO" --title "$release_title" --notes-file release-notes.md

            for asset in "${assets[@]}"; do
              base="$(basename "$asset")"
              expected_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
              remote_digest="$(gh api "repos/$GH_REPO/releases/tags/$release_tag" \
                --jq ".assets[] | select(.name == \"$base\") | .digest")"
              [ "$remote_digest" = "$expected_digest" ] || {
                echo "Published asset digest mismatch for $base" >&2
                exit 1
              }
            done
            [ "$(gh api "repos/$GH_REPO/git/ref/tags/$release_tag" --jq '.object.sha')" = "$GITHUB_SHA" ]

            gh api "repos/$GH_REPO/releases/tags/$release_tag" \
              --jq ".assets[] | select(.name | startswith(\"$backup_prefix\")) | .id" |
              while IFS= read -r asset_id; do
                [ -z "$asset_id" ] || gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
              done
          else
            gh release create "$release_tag" "${assets[@]}" \
              --repo "$GH_REPO" --title "$release_title" --notes-file release-notes.md --verify-tag
          fi
