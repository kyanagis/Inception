name: Build Inception OVA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".github/workflows/ova.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Inception
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = auto
            cores = 2

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-keys: |
            nix-store-${{ runner.os }}-

      - name: Build OVA
        run: nix build path:.#packages.x86_64-linux.vbox -o result-vbox --print-build-logs

      - name: Split OVA for reusable artifact
        run: |
          ova="$(find -L result-vbox -type f -name '*.ova' -print -quit)"
          test -n "$ova"
          split -b 1900M "$ova" inception.ova.part-

          shopt -s nullglob
          parts=(inception.ova.part-*)
          test "${#parts[@]}" -gt 0

      - name: Preserve built OVA parts immediately
        uses: actions/upload-artifact@v4
        with:
          name: inception-ova-parts
          path: inception.ova.part-*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  package:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Inception
        uses: actions/checkout@v4

      - name: Restore built OVA parts
        uses: actions/download-artifact@v4
        with:
          name: inception-ova-parts
          path: .

      - name: Create and verify checksum
        run: |
          shopt -s nullglob
          parts=(inception.ova.part-*)
          test "${#parts[@]}" -gt 0

          expected="$(cat inception.ova.part-* | sha256sum | awk '{print $1}')"
          printf '%s  inception.ova\n' "$expected" > inception.ova.sha256

          actual="$(cat inception.ova.part-* | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

          cat > release-body.md <<EOF
          公開用Inception VirtualBox OVAです。GitHubの1ファイル容量制限に合わせてpartへ分割しています。
          全partとinception.ova.sha256をダウンロードし、cat inception.ova.part-* > inception.ova で結合してください。
          結合後のSHA-256: $expected
          EOF

      - name: Upload packaged OVA artifact
        uses: actions/upload-artifact@v4
        with:
          name: inception-ova
          path: |
            inception.ova.part-*
            inception.ova.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Move ova-latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f ova-latest "$GITHUB_SHA"
          git push --force origin refs/tags/ova-latest

      - name: Publish latest GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ova-latest
          name: Inception VirtualBox OVA
          body_path: release-body.md
          files: |
            inception.ova.part-*
            inception.ova.sha256
          overwrite_files: true

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            inception.ova.part-*
            inception.ova.sha256
          generate_release_notes: true
