name: OVA Source CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ova-source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout OVA source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require host ABI bump for runtime changes
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          [ -n "$base" ] || { echo "No base SHA available; skipping ABI delta check"; exit 0; }
          case "$base" in
            0000000000000000000000000000000000000000) exit 0 ;;
          esac

          runtime_paths=(
            flake.nix
            flake.lock
            nix/base.nix
            nix/tooling.nix
            nix/virtualbox.nix
            nix/scripts/inception-host-update.sh
            nix/scripts/inception-evaluate.sh
          )
          extract_abi() {
            sed -n 's/.*inception-host-abi".text = "\([0-9][0-9]*\)\\n";.*/\1/p' | head -n 1
          }
          new_abi="$(extract_abi < nix/tooling.nix)"
          [ -n "$new_abi" ] || {
            echo "Unable to parse current host ABI from nix/tooling.nix" >&2
            exit 1
          }

          changed="$(git diff --name-only "$base" "$GITHUB_SHA" -- "${runtime_paths[@]}")"
          [ -n "$changed" ] || {
            printf 'Current host ABI parses as %s; no runtime-affecting files changed.\n' "$new_abi"
            exit 0
          }

          old_abi="$(git show "$base:nix/tooling.nix" | extract_abi)"
          [ -n "$old_abi" ] && [ -n "$new_abi" ] || {
            echo "Unable to parse host ABI from nix/tooling.nix" >&2
            exit 1
          }
          if [ "$new_abi" -le "$old_abi" ]; then
            echo "Runtime-affecting files changed without a host ABI bump." >&2
            echo "base ABI=$old_abi current ABI=$new_abi" >&2
            printf 'changed runtime files:\n%s\n' "$changed" >&2
            exit 1
          fi
          printf 'Host ABI bump verified: %s -> %s\n' "$old_abi" "$new_abi"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11
      - name: Check NixOS and universal tooling contract
        run: nix flake check path:. -L --show-trace


  release-cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove obsolete OVA release and rewrite latest release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v2026.09.22-ova.2 >/dev/null 2>&1; then
            gh release delete v2026.09.22-ova.2 --cleanup-tag --yes
          fi

          cat > /tmp/ova-release-notes.md <<'EOF'
          42 Inceptionの評価用に作った x86_64 NixOS / VirtualBoxアプライアンスです。

          このOVAには評価対象のsourceは入れてません。
          初回起動後に自分の42 loginを設定して、`submit`ブランチをcloneして`make`してください。

          ```bash
          inception-setup YOUR_42_LOGIN

          cd /home/inception
          git clone --branch submit --single-branch \
            https://github.com/kyanagis/Inception.git Inception

          cd Inception
          make
          ```

          通常の`submit`変更ではOVAを再生成する必要はありません。
          userspace側で追加のtoolが必要になった場合はNixで補完し、host側の変更が必要になった場合は`inception-host-update`で追従できるようにしてあります。

          現在の確認状況:

          - OVA source: `a89c46834a6f1763404637bd344250a86eabdc30`
          - current submit compatibility: `4ea0f08f4d9329c48cc635b78361875cb4d0747a`
          - x86_64
          - VirtualBox import確認済み
          - 公開OVAのdiskを実bootしてsshd到達まで確認済み
          - SHA-256 / provenance確認済み
          - RAM 4 GiB / CPU 4 vCPU

          必要環境:

          - VirtualBox 7.x
          - x86_64 CPU
          - RAM 4 GiB
          - 空き容量 35 GiB以上

          OVAはGitHub Releaseの容量制限のため分割しています。

          ```bash
          cat inception.ova.part-* > inception.ova
          sha256sum --check --ignore-missing SHA256SUMS
          ```

          `inception.ova: OK` が出たら、その`inception.ova`をVirtualBoxへimportしてください。
          EOF

          gh release edit ova-latest \
            --title 'Inception Universal OVA（最新版）' \
            --notes-file /tmp/ova-release-notes.md
