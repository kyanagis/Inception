name: Submit Compatibility CI

on:
  push:
    branches:
      - submit
  pull_request:
    branches:
      - submit
  workflow_dispatch:

concurrency:
  group: submit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout submit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require ABI bump when host contract changes
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          [ -n "$base" ] || exit 0
          case "$base" in
            0000000000000000000000000000000000000000) exit 0 ;;
          esac
          if ! git cat-file -e "$base:.inception/host-contract.json" 2>/dev/null; then
            echo "No previous host contract; treating this as initial contract introduction."
            exit 0
          fi
          old_contract="$(git show "$base:.inception/host-contract.json" | jq -S 'del(.host_abi)')"
          new_contract="$(jq -S 'del(.host_abi)' .inception/host-contract.json)"
          if [ "$old_contract" = "$new_contract" ]; then
            echo "Only the minimum required host ABI changed; no capability bump is required."
            exit 0
          fi

          old_abi="$(git show "$base:.inception/host-abi" | tr -d '[:space:]')"
          new_abi="$(tr -d '[:space:]' < .inception/host-abi)"
          [[ "$old_abi" =~ ^[0-9]+$ && "$new_abi" =~ ^[0-9]+$ ]] || {
            echo "Invalid host ABI while checking contract change" >&2
            exit 1
          }
          if [ "$new_abi" -le "$old_abi" ]; then
            echo "Host capability contract changed without incrementing .inception/host-abi" >&2
            echo "old ABI=$old_abi new ABI=$new_abi" >&2
            exit 1
          fi
          printf 'Host capability contract ABI bump verified: %s -> %s\n' "$old_abi" "$new_abi"

      - name: Install Nix for forward-compatible tool checks
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Validate required host ABI exists on main
        shell: bash
        run: |
          set -euo pipefail
          required="$(tr -d '[:space:]' < .inception/host-abi)"
          [[ "$required" =~ ^[0-9]+$ ]] || { echo "Invalid submit host ABI: $required" >&2; exit 1; }
          git fetch --depth=1 origin main:refs/remotes/origin/main
          provided="$(
            git show refs/remotes/origin/main:nix/tooling.nix |
              sed -n 's/.*inception-host-abi".text = "\([0-9][0-9]*\)\\n";.*/\1/p' |
              head -n 1
          )"
          [[ "$provided" =~ ^[0-9]+$ ]] || { echo "Unable to parse main host ABI" >&2; exit 1; }
          if [ "$required" -gt "$provided" ]; then
            echo "submit requires host ABI $required but main only provides $provided" >&2
            exit 1
          fi
          printf 'Host ABI contract satisfied: submit=%s main=%s\n' "$required" "$provided"

      - name: Validate main runtime satisfies submit host contract
        shell: bash
        run: |
          set -euo pipefail
          main_dir="$RUNNER_TEMP/inception-main"
          git worktree add --detach "$main_dir" refs/remotes/origin/main >/dev/null
          trap 'git worktree remove --force "$main_dir" >/dev/null 2>&1 || true' EXIT

          system="$(nix eval --raw "path:$main_dir#nixosConfigurations.inception-runtime.pkgs.stdenv.hostPlatform.system")"
          docker_version="$(nix eval --raw "path:$main_dir#nixosConfigurations.inception-runtime.config.virtualisation.docker.package.version")"
          compose_version="$(nix eval --raw "path:$main_dir#nixosConfigurations.inception-runtime.pkgs.docker-compose.version")"
          firewall_ports="$(nix eval --json "path:$main_dir#nixosConfigurations.inception-runtime.config.networking.firewall.allowedTCPPorts")"
          firewall_ranges="$(nix eval --json "path:$main_dir#nixosConfigurations.inception-runtime.config.networking.firewall.allowedTCPPortRanges")"

          required_arch="$(jq -r '.architecture' .inception/host-contract.json)"
          required_docker="$(jq -r '.docker_engine_min' .inception/host-contract.json)"
          required_compose="$(jq -r '.docker_compose_min' .inception/host-contract.json)"
          [ "$system" = "$required_arch-linux" ] || {
            echo "main runtime architecture $system does not satisfy $required_arch" >&2
            exit 1
          }
          [ "$(printf '%s\n' "$required_docker" "$docker_version" | sort -V | head -n 1)" = "$required_docker" ] || {
            echo "main Docker $docker_version is below required $required_docker" >&2
            exit 1
          }
          [ "$(printf '%s\n' "$required_compose" "$compose_version" | sort -V | head -n 1)" = "$required_compose" ] || {
            echo "main Compose $compose_version is below required $required_compose" >&2
            exit 1
          }

          jq -e --argjson host "$firewall_ports" '
            all(.public_tcp_ports[]; . as $p | ($host | index($p)) != null)
          ' .inception/host-contract.json >/dev/null || {
            echo "main firewall does not expose every required public TCP port" >&2
            echo "main ports=$firewall_ports" >&2
            exit 1
          }
          jq -e --argjson host "$firewall_ranges" '
            all(.public_tcp_ranges[]; . as $required |
              any($host[]; .from <= $required.from and .to >= $required.to))
          ' .inception/host-contract.json >/dev/null || {
            echo "main firewall does not cover every required public TCP range" >&2
            echo "main ranges=$firewall_ranges" >&2
            exit 1
          }
          printf 'Main runtime satisfies host contract: %s, Docker %s, Compose %s\n'             "$system" "$docker_version" "$compose_version"

      - name: Validate universal OVA tool declarations
        shell: bash
        run: |
          set -euo pipefail
          test -f .inception/host-tools
          while read -r command package extra; do
            [[ -z "${command:-}" || "$command" == \#* ]] && continue
            test -n "${package:-}"
            test -z "${extra:-}"
            [[ "$command" =~ ^[A-Za-z0-9._+-]+$ ]]
            [[ "$package" =~ ^[A-Za-z0-9._+-]+$ ]]
            mapfile -t outputs < <(nix build --no-link --print-out-paths "nixpkgs#$package")
            found=0
            for output in "${outputs[@]}"; do
              if [ -x "$output/bin/$command" ] || [ -x "$output/sbin/$command" ]; then
                found=1
                break
              fi
            done
            [ "$found" -eq 1 ] || {
              echo "nixpkgs#$package does not provide declared command $command" >&2
              exit 1
            }
          done < .inception/host-tools

      - name: Dependency freshness and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          sh ./srcs/tools/dependency-audit.sh

      - name: Prepare isolated Docker data-root
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop docker.service docker.socket || true
          sudo install -d -o root -g root -m 0710 /home/runner/data/docker
          config="$(sudo cat /etc/docker/daemon.json 2>/dev/null || printf '{}')"
          printf '%s' "$config" | jq --arg root /home/runner/data/docker '. + {"data-root": $root}' |
            sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker.socket docker.service
          for attempt in $(seq 1 60); do
            if root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null)" &&
               [ "$root" = /home/runner/data/docker ]; then
              break
            fi
            sleep 1
          done
          test "$(docker info --format '{{.DockerRootDir}}')" = /home/runner/data/docker
          printf '127.0.0.1 runner.42.fr\n' | sudo tee -a /etc/hosts >/dev/null

      - name: Clone-equivalent mandatory path
        shell: bash
        env:
          INCEPTION_LOGIN: runner
        run: |
          set -euo pipefail
          test ! -e srcs/.env
          make
          test -f srcs/.env
          make test
          make audit
          test -z "$(git status --porcelain --untracked-files=no)"
          site_before="$(docker compose --env-file srcs/.env -f srcs/docker-compose.yml exec -T --user www-data wordpress wp option get siteurl --path=/var/www/html)"
          salts_before="$(docker compose --env-file srcs/.env -f srcs/docker-compose.yml exec -T wordpress sha256sum /var/www/.inception-state/salts | awk '{print $1}')"
          make restart
          site_after="$(docker compose --env-file srcs/.env -f srcs/docker-compose.yml exec -T --user www-data wordpress wp option get siteurl --path=/var/www/html)"
          salts_after="$(docker compose --env-file srcs/.env -f srcs/docker-compose.yml exec -T wordpress sha256sum /var/www/.inception-state/salts | awk '{print $1}')"
          test "$site_before" = "$site_after"
          test "$salts_before" = "$salts_after"

      - name: Stable submit evaluation ABI and mode transition matrix
        shell: bash
        env:
          INCEPTION_LOGIN: runner
        run: |
          set -euo pipefail
          # Existing mandatory state -> mandatory -> bonus.
          sh ./.inception/evaluate full
          # Prove the same persistent volumes can converge back to mandatory
          # and then to bonus again without stale WordPress/Redis state.
          make test
          make bonus-test
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install Trivy vulnerability scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true

      - name: Gate fixable critical vulnerabilities in built images
        shell: bash
        run: |
          set -euo pipefail
          images=(
            mariadb:inception
            wordpress:inception
            nginx:inception
            redis:inception
            ftp:inception
            static-site:inception
            adminer:inception
            backup:inception
          )
          for image in "${images[@]}"; do
            echo "=== Trivy: $image ==="
            trivy image \
              --scanners vuln \
              --pkg-types os,library \
              --ignore-unfixed \
              --severity CRITICAL \
              --exit-code 1 \
              --timeout 10m \
              "$image"
          done

      - name: Fault injection recovery
        shell: bash
        env:
          INCEPTION_LOGIN: runner
        run: |
          set -euo pipefail
          sh ./srcs/tools/fault-injection-test.sh

      - name: Evidence
        if: always()
        shell: bash
        run: |
          set +e
          git rev-parse HEAD
          docker info --format 'DockerRootDir={{.DockerRootDir}}' || true
          if [ -f srcs/.env ]; then
            docker compose --env-file srcs/.env -f srcs/docker-compose.yml --profile bonus ps || true
            docker ps -a --filter label=com.docker.compose.project=inception \
              --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo '--- redacted container logs ---'
            docker compose --env-file srcs/.env -f srcs/docker-compose.yml --profile bonus logs \
              --no-color --tail=200 2>&1 | sed -E \
              -e 's/[0-9a-fA-F]{64}/<redacted-hex64>/g' \
              -e 's/((password|passwd|secret)[=:])[[:graph:]]+/\\1<redacted>/Ig' \
              -e 's#(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY).*#<redacted-private-key>#g' || true
          else
            echo 'srcs/.env was not generated because an earlier compatibility gate failed.'
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: docker compose --env-file srcs/.env -f srcs/docker-compose.yml --profile bonus down --volumes --remove-orphans || true
