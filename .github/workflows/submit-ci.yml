name: Submit Compatibility CI

on:
  push:
    branches:
      - submit
  pull_request:
    branches:
      - submit
  workflow_dispatch:

concurrency:
  group: submit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout submit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Nix for forward-compatible tool checks
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Validate required host ABI exists on main
        shell: bash
        run: |
          set -euo pipefail
          required="$(tr -d '[:space:]' < .inception/host-abi)"
          [[ "$required" =~ ^[0-9]+$ ]] || { echo "Invalid submit host ABI: $required" >&2; exit 1; }
          git fetch --depth=1 origin main:refs/remotes/origin/main
          provided="$(
            git show refs/remotes/origin/main:nix/tooling.nix |
              sed -n 's/.*inception-host-abi".text = "\([0-9][0-9]*\)\\n";.*/\1/p' |
              head -n 1
          )"
          [[ "$provided" =~ ^[0-9]+$ ]] || { echo "Unable to parse main host ABI" >&2; exit 1; }
          if [ "$required" -gt "$provided" ]; then
            echo "submit requires host ABI $required but main only provides $provided" >&2
            exit 1
          fi
          printf 'Host ABI contract satisfied: submit=%s main=%s\n' "$required" "$provided"

      - name: Validate universal OVA tool declarations
        shell: bash
        run: |
          set -euo pipefail
          test -f .inception/host-tools
          while read -r command package extra; do
            [[ -z "${command:-}" || "$command" == \#* ]] && continue
            test -n "${package:-}"
            test -z "${extra:-}"
            [[ "$command" =~ ^[A-Za-z0-9._+-]+$ ]]
            [[ "$package" =~ ^[A-Za-z0-9._+-]+$ ]]
            mapfile -t outputs < <(nix build --no-link --print-out-paths "nixpkgs#$package")
            found=0
            for output in "${outputs[@]}"; do
              if [ -x "$output/bin/$command" ] || [ -x "$output/sbin/$command" ]; then
                found=1
                break
              fi
            done
            [ "$found" -eq 1 ] || {
              echo "nixpkgs#$package does not provide declared command $command" >&2
              exit 1
            }
          done < .inception/host-tools

      - name: Prepare isolated Docker data-root
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop docker.service docker.socket || true
          sudo install -d -o root -g root -m 0710 /home/runner/data/docker
          config="$(sudo cat /etc/docker/daemon.json 2>/dev/null || printf '{}')"
          printf '%s' "$config" | jq --arg root /home/runner/data/docker '. + {"data-root": $root}' |
            sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker.socket docker.service
          for attempt in $(seq 1 60); do
            if root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null)" &&
               [ "$root" = /home/runner/data/docker ]; then
              break
            fi
            sleep 1
          done
          test "$(docker info --format '{{.DockerRootDir}}')" = /home/runner/data/docker
          printf '127.0.0.1 runner.42.fr\n' | sudo tee -a /etc/hosts >/dev/null

      - name: Clone-equivalent mandatory path
        shell: bash
        env:
          INCEPTION_LOGIN: runner
        run: |
          set -euo pipefail
          test ! -e srcs/.env
          make
          test -f srcs/.env
          make test
          make audit
          test -z "$(git status --porcelain --untracked-files=no)"
          site_before="$(docker compose --env-file srcs/.env -f srcs/docker-compose.yml exec -T --user www-data wordpress wp option get siteurl --path=/var/www/html)"
          make restart
          site_after="$(docker compose --env-file srcs/.env -f srcs/docker-compose.yml exec -T --user www-data wordpress wp option get siteurl --path=/var/www/html)"
          test "$site_before" = "$site_after"

      - name: Stable submit evaluation ABI and mode transition matrix
        shell: bash
        env:
          INCEPTION_LOGIN: runner
        run: |
          set -euo pipefail
          # Existing mandatory state -> mandatory -> bonus.
          sh ./.inception/evaluate full
          # Prove the same persistent volumes can converge back to mandatory
          # and then to bonus again without stale WordPress/Redis state.
          make test
          make bonus-test
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Evidence
        if: always()
        shell: bash
        run: |
          set +e
          git rev-parse HEAD
          docker info --format 'DockerRootDir={{.DockerRootDir}}'
          docker compose --env-file srcs/.env -f srcs/docker-compose.yml --profile bonus ps
          docker ps -a --filter label=com.docker.compose.project=inception \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo '--- redacted container logs ---'
          docker compose --env-file srcs/.env -f srcs/docker-compose.yml --profile bonus logs \
            --no-color --tail=200 2>&1 | sed -E \
            -e 's/[0-9a-fA-F]{64}/<redacted-hex64>/g' \
            -e 's/((password|passwd|secret)[=:])[[:graph:]]+/\\1<redacted>/Ig' \
            -e 's#(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY).*#<redacted-private-key>#g'

      - name: Cleanup
        if: always()
        shell: bash
        run: docker compose --env-file srcs/.env -f srcs/docker-compose.yml --profile bonus down --volumes --remove-orphans || true
