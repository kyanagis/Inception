name: Released OVA Import Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build Universal Inception OVA"
      - "Submit Compatibility CI"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ova-release-smoke.yml"

concurrency:
  group: released-ova-import-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  import:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11

      - name: Download published ova-latest assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download ova-latest --repo "$GH_REPO" --dir release-assets             --pattern 'inception.ova.part-*'             --pattern 'SHA256SUMS'             --pattern 'BUILD-PROVENANCE.txt'             --pattern 'OVA-CAPABILITIES.txt'
          test -s release-assets/inception.ova.part-00
          test -s release-assets/inception.ova.part-01
          test -s release-assets/SHA256SUMS

      - name: Verify release provenance matches ova-latest tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source_sha="$(sed -n 's/^OVA source commit: //p' release-assets/BUILD-PROVENANCE.txt)"
          test -n "$source_sha"
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/ova-latest" --jq '.object.sha')"
          test "$source_sha" = "$tag_sha"
          printf 'Published OVA provenance matches tag: %s\n' "$source_sha"

      - name: Reassemble and verify published OVA
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          cat inception.ova.part-* > inception.ova
          expected="$(awk '$2 == "inception.ova" {print $1}' SHA256SUMS)"
          test -n "$expected"
          actual="$(sha256sum inception.ova | awk '{print $1}')"
          test "$actual" = "$expected"
          sha256sum --check --ignore-missing SHA256SUMS

      - name: Import published OVA and boot its disk
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/vbox-home"
          mkdir -p "$HOME"

          # First prove the released appliance imports as an actual VirtualBox
          # appliance. GitHub-hosted runners do not provide vboxdrv, so boot the
          # exact released VMDK with their available KVM accelerator afterwards.
          nix shell nixpkgs#virtualbox --command bash -euo pipefail -c '
            vm="InceptionReleaseSmoke"
            cleanup() {
              VBoxManage unregistervm "$vm" --delete >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            VBoxManage import release-assets/inception.ova --vsys 0 --vmname "$vm"
            VBoxManage showvminfo "$vm" --machinereadable > release-assets/VBOX-IMPORT.txt
            grep -Fq "name=\"$vm\"" release-assets/VBOX-IMPORT.txt
            grep -Eq "^memory=4096$" release-assets/VBOX-IMPORT.txt
            grep -Eq "^cpus=4$" release-assets/VBOX-IMPORT.txt
          '

          mkdir -p release-assets/boot-disk
          tar -xf release-assets/inception.ova -C release-assets/boot-disk
          source_disk="$(find release-assets/boot-disk -maxdepth 1 -type f -name '*.vmdk' -print -quit)"
          test -n "$source_disk"

          # VirtualBox exports a streamOptimized VMDK. QEMU can read that format
          # but it is not suitable as a writable root filesystem: ext4 journal
          # updates fail with I/O errors. Convert the exact released disk content
          # to a writable QCOW2 solely for the cross-hypervisor boot probe.
          disk="$GITHUB_WORKSPACE/release-assets/boot-disk/inception-boot.qcow2"
          nix shell nixpkgs#qemu --command qemu-img convert -f vmdk -O qcow2 "$source_disk" "$disk"
          qemu_img_info="$(nix shell nixpkgs#qemu --command qemu-img info --output=json "$disk")"
          printf '%s\n' "$qemu_img_info" > release-assets/QEMU-DISK.json
          jq -e '.format == "qcow2"' release-assets/QEMU-DISK.json >/dev/null

          # Modify only the disposable QCOW2 copy: inject a CI-only SSH key so
          # the smoke test can exercise the actual released userspace.  The
          # published OVA/VMDK remains byte-for-byte untouched.
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ova-smoke-key"
          qemu_nbd="$(nix shell nixpkgs#qemu --command sh -c 'command -v qemu-nbd')"
          test -x "$qemu_nbd"
          sudo modprobe nbd max_part=16
          sudo "$qemu_nbd" --connect=/dev/nbd0 "$disk"
          nbd_connected=1
          cleanup_nbd() {
            if [ "${nbd_connected:-0}" -eq 1 ]; then
              sudo "$qemu_nbd" --disconnect /dev/nbd0 >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_nbd EXIT
          for attempt in $(seq 1 30); do
            [ -b /dev/nbd0p1 ] && break
            sleep 1
          done
          test -b /dev/nbd0p1
          mount_dir="$RUNNER_TEMP/ova-root"
          mkdir -p "$mount_dir"
          sudo mount /dev/nbd0p1 "$mount_dir"
          home_owner="$(stat -c '%u:%g' "$mount_dir/home/inception")"
          sudo install -d -m 0700 "$mount_dir/home/inception/.ssh"
          sudo cp "$RUNNER_TEMP/ova-smoke-key.pub" "$mount_dir/home/inception/.ssh/authorized_keys"
          sudo chown -R "$home_owner" "$mount_dir/home/inception/.ssh"
          sudo chmod 0600 "$mount_dir/home/inception/.ssh/authorized_keys"
          sync
          sudo umount "$mount_dir"
          sudo "$qemu_nbd" --disconnect /dev/nbd0
          nbd_connected=0
          trap - EXIT

          # Reclaim runner disk before the guest performs Docker builds.
          rm -f release-assets/inception.ova release-assets/inception.ova.part-*
          rm -f "$source_disk"

          qemu_system="$(nix shell nixpkgs#qemu --command sh -c 'command -v qemu-system-x86_64')"
          socat_bin="$(nix shell nixpkgs#socat --command sh -c 'command -v socat')"
          test -x "$qemu_system"
          test -x "$socat_bin"
          pidfile="$RUNNER_TEMP/inception-qemu.pid"
          serial="$GITHUB_WORKSPACE/release-assets/QEMU-SERIAL.txt"
          monitor="$RUNNER_TEMP/inception-qemu.monitor"
          monitor_log="$GITHUB_WORKSPACE/release-assets/QEMU-MONITOR.txt"
          screen="$GITHUB_WORKSPACE/release-assets/QEMU-SCREEN.ppm"

          dump_state() {
            {
              printf "info status\n"
              printf "info block\n"
              printf "info pci\n"
              printf "screendump %s\n" "$screen"
            } | "$socat_bin" - "UNIX-CONNECT:$monitor" > "$monitor_log" 2>&1 || true
          }

          cleanup() {
            if [ -s "$pidfile" ]; then
              pid="$(cat "$pidfile")"
              kill "$pid" >/dev/null 2>&1 || true
              for _ in $(seq 1 30); do
                kill -0 "$pid" >/dev/null 2>&1 || break
                sleep 1
              done
              kill -9 "$pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          "$qemu_system" \
            -enable-kvm \
            -machine pc,accel=kvm \
            -cpu host \
            -m 4096 \
            -smp 4 \
            -device ich9-ahci,id=sata \
            -drive "file=$disk,format=qcow2,if=none,id=osdisk,cache=none" \
            -device ide-hd,drive=osdisk,bus=sata.0 \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -boot order=c,menu=off \
            -display none \
            -serial "file:$serial" \
            -monitor "unix:$monitor,server=on,wait=off" \
            -daemonize \
            -pidfile "$pidfile"

          booted=0
          for attempt in $(seq 1 90); do
            if ssh-keyscan -T 1 -p 2222 127.0.0.1 > "$GITHUB_WORKSPACE/release-assets/SSH-HOSTKEYS.txt" 2>/dev/null &&
               test -s "$GITHUB_WORKSPACE/release-assets/SSH-HOSTKEYS.txt"; then
              booted=1
              break
            fi
            kill -0 "$(cat "$pidfile")" >/dev/null 2>&1 || {
              echo "QEMU exited before sshd became reachable" >&2
              dump_state
              cat "$serial" >&2 || true
              cat "$monitor_log" >&2 || true
              exit 1
            }
            sleep 1
          done
          if [ "$booted" -ne 1 ]; then
            echo "Published OVA did not reach sshd within the boot budget" >&2
            dump_state
            cat "$serial" >&2 || true
            cat "$monitor_log" >&2 || true
            exit 1
          fi
          printf "Published OVA booted to sshd through KVM.\n" | tee "$GITHUB_WORKSPACE/release-assets/QEMU-BOOT.txt"

          ssh_opts=(
            -i "$RUNNER_TEMP/ova-smoke-key"
            -p 2222
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=8
          )

          if ! ssh "${ssh_opts[@]}" inception@127.0.0.1 '
            set -euo pipefail
            printf "guest-abi=%s\n" "$(cat /etc/inception-host-abi)"
            test "$(uname -m)" = x86_64
            systemctl is-active docker.service
            systemctl is-active display-manager.service
            inception-setup smoke42
            test "$(hostname)" = smoke42.42.fr
            test "$(readlink /home/inception/data)" = /home/smoke42/data
            test "$(readlink -f "$(docker info --format "{{.DockerRootDir}}")")" = /home/smoke42/data/docker
            rm -rf /home/inception/Inception
            git clone --branch submit --single-branch https://github.com/kyanagis/Inception.git /home/inception/Inception
            cd /home/inception/Inception
            make test
            make audit
            make bonus-test
            make audit
            test -z "$(git status --porcelain --untracked-files=no)"

            abi="$(cat /etc/inception-host-abi)"
            if [ "$abi" -ge 6 ]; then
              command -v xfce4-terminal
              command -v mousepad
              ls -l "$HOME/Desktop/Terminal.desktop" "$HOME/Desktop/Text-Editor.desktop"
              test -x "$HOME/Desktop/Terminal.desktop"
              test -x "$HOME/Desktop/Text-Editor.desktop"
              grep -F "TerminalEmulator=xfce4-terminal" "$HOME/.config/xfce4/helpers.rc"
              grep -F "text/plain=org.xfce.mousepad.desktop" "$HOME/.config/mimeapps.list"

              session_pid=
              for attempt in $(seq 1 60); do
                session_pid="$(pgrep -u inception -f xfce4-session | head -n 1 || true)"
                if [ -n "$session_pid" ]; then
                  break
                fi
                sleep 1
              done
              if [ -z "$session_pid" ]; then
                echo "--- GUI session diagnostics ---" >&2
                ps -fu inception >&2 || true
                systemctl status display-manager.service --no-pager >&2 || true
                journalctl -u display-manager.service --no-pager -n 200 >&2 || true
                ls -la "$HOME" "$HOME/Desktop" "$HOME/.config" "$HOME/.config/xfce4" >&2 || true
                exit 31
              fi
              session_env="$(tr "\\0" "\\n" < "/proc/$session_pid/environ")"
              display="$(printf "%s\\n" "$session_env" | sed -n "s/^DISPLAY=//p" | head -n 1)"
              xauthority="$(printf "%s\\n" "$session_env" | sed -n "s/^XAUTHORITY=//p" | head -n 1)"
              dbus_address="$(printf "%s\\n" "$session_env" | sed -n "s/^DBUS_SESSION_BUS_ADDRESS=//p" | head -n 1)"
              test -n "$display"
              test -n "$dbus_address"
              if [ -z "$xauthority" ]; then
                xauthority="$HOME/.Xauthority"
              fi
              test -r "$xauthority"

              rm -f /tmp/inception-terminal-gui-ok
              env DISPLAY="$display" XAUTHORITY="$xauthority" DBUS_SESSION_BUS_ADDRESS="$dbus_address" \
                xfce4-terminal --disable-server --command="sh -c \"printf gui-terminal-ok > /tmp/inception-terminal-gui-ok\"" >/tmp/xfce-terminal-smoke.log 2>&1 &
              for attempt in $(seq 1 30); do
                [ -s /tmp/inception-terminal-gui-ok ] && break
                sleep 1
              done
              grep -Fx gui-terminal-ok /tmp/inception-terminal-gui-ok

              printf "gui-editor-ok\\n" > /tmp/inception-editor-probe.txt
              env DISPLAY="$display" XAUTHORITY="$xauthority" DBUS_SESSION_BUS_ADDRESS="$dbus_address" \
                mousepad --disable-server /tmp/inception-editor-probe.txt >/tmp/mousepad-smoke.log 2>&1 &
              editor_pid=$!
              sleep 3
              kill -0 "$editor_pid"
              kill "$editor_pid" >/dev/null 2>&1 || true
              wait "$editor_pid" >/dev/null 2>&1 || true
            fi

            printf "first-pass-submit=%s\n" "$(git rev-parse HEAD)"
          ' | tee "$GITHUB_WORKSPACE/release-assets/OVA-E2E.txt"; then
            {
              echo '--- guest failure diagnostics ---'
              ssh "${ssh_opts[@]}" inception@127.0.0.1 '
                set +e
                cd /home/inception/Inception 2>/dev/null || exit 0
                echo "HEAD=$(git rev-parse HEAD 2>/dev/null)"
                echo "HOST_ABI=$(cat /etc/inception-host-abi 2>/dev/null)"
                echo "DOCKER_ROOT=$(docker info --format "{{.DockerRootDir}}" 2>/dev/null)"
                echo "--- df ---"
                df -hT / /home/inception /home/smoke42/data 2>/dev/null
                echo "--- compose ps ---"
                docker compose --env-file srcs/.env -f srcs/docker-compose.yml --profile bonus ps -a 2>&1
                echo "--- wordpress inspect ---"
                wp_id="$(docker compose --env-file srcs/.env -f srcs/docker-compose.yml ps -aq wordpress 2>/dev/null)"
                if [ -n "$wp_id" ]; then
                  docker inspect --format "{{json .State}}" "$wp_id" 2>&1
                  docker inspect --format "{{json .Mounts}}" "$wp_id" 2>&1
                  docker inspect --format "{{json .HostConfig.Tmpfs}}" "$wp_id" 2>&1
                  echo "--- wordpress health command ---"
                  docker inspect --format "{{json .Config.Healthcheck}}" "$wp_id" 2>&1
                  echo "--- wordpress logs ---"
                  docker logs --tail 300 "$wp_id" 2>&1
                  echo "--- wordpress volume state ---"
                  docker exec "$wp_id" sh -c "id; stat -c \"%U:%G %u:%g %a %n\" /var/www /var/www/html /var/www/.inception-state /run/php 2>/dev/null; ls -la /var/www /var/www/.inception-state /run/php 2>/dev/null" 2>&1
                fi
                echo "--- mariadb logs ---"
                db_id="$(docker compose --env-file srcs/.env -f srcs/docker-compose.yml ps -aq mariadb 2>/dev/null)"
                [ -z "$db_id" ] || docker logs --tail 200 "$db_id" 2>&1
                echo "--- docker daemon journal ---"
                journalctl -u docker.service --no-pager -n 150 2>&1
              '
            } | tee "$GITHUB_WORKSPACE/release-assets/OVA-FAILURE-DIAGNOSTICS.txt"
            echo '::error title=Initial guest lifecycle failed::The published guest failed before the reboot phase; inspect the ova-release-import-evidence artifact.'
            exit 1
          fi

          # Exercise the evaluator-facing reboot path gracefully.  The released
          # appliance intentionally ships with the temporary local password
          # "inception"; the guide requires changing it before real use.  Using
          # sudo here avoids turning a Docker-write-in-progress hard reset into
          # a false negative for the release gate.
          ssh "${ssh_opts[@]}" inception@127.0.0.1             "printf '%s\\n' inception | sudo -S -p '' systemctl reboot" || true

          went_down=0
          for attempt in $(seq 1 90); do
            if ! ssh "${ssh_opts[@]}" inception@127.0.0.1 true >/dev/null 2>&1; then
              went_down=1
              break
            fi
            sleep 1
          done
          if [ "$went_down" -ne 1 ]; then
            echo "Guest did not leave SSH during graceful reboot" >&2
            dump_state
            exit 1
          fi

          came_back=0
          for attempt in $(seq 1 180); do
            if ssh "${ssh_opts[@]}" inception@127.0.0.1 true >/dev/null 2>&1; then
              came_back=1
              break
            fi
            sleep 1
          done
          if [ "$came_back" -ne 1 ]; then
            echo "Guest did not return to SSH after graceful reboot" >&2
            dump_state
            cat "$serial" >&2 || true
            exit 1
          fi

          # SSH is intentionally available before the multi-user target has
          # finished restarting Docker and LightDM.  Do not confuse transport
          # readiness with the evaluator-facing service readiness contract.
          services_ready=0
          for attempt in $(seq 1 180); do
            if ssh "${ssh_opts[@]}" inception@127.0.0.1 '
              systemctl is-active --quiet docker.service &&
              systemctl is-active --quiet display-manager.service &&
              docker info >/dev/null
            ' >/dev/null 2>&1; then
              services_ready=1
              break
            fi
            sleep 1
          done
          if [ "$services_ready" -ne 1 ]; then
            echo "Guest services did not become ready after graceful reboot" >&2
            dump_state
            cat "$serial" >&2 || true
            exit 1
          fi

          if ! ssh "${ssh_opts[@]}" inception@127.0.0.1 '
            set -euo pipefail
            test "$(hostname)" = smoke42.42.fr
            test "$(readlink /home/inception/data)" = /home/smoke42/data
            test "$(readlink -f "$(docker info --format "{{.DockerRootDir}}")")" = /home/smoke42/data/docker
            systemctl is-active docker.service
            systemctl is-active display-manager.service
            cd /home/inception/Inception
            make test
            make audit
            test -z "$(git status --porcelain --untracked-files=no)"
            printf "reboot-persistence=ok\n"
          ' | tee -a "$GITHUB_WORKSPACE/release-assets/OVA-E2E.txt"; then
            echo '::error title=Post-reboot guest lifecycle failed::The guest passed initial lifecycle but failed the persistent-state probe after reboot.'
            dump_state
            exit 1
          fi

      - name: Publish import evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ova-release-import-evidence
          path: |
            release-assets/BUILD-PROVENANCE.txt
            release-assets/OVA-CAPABILITIES.txt
            release-assets/VBOX-IMPORT.txt
            release-assets/QEMU-BOOT.txt
            release-assets/OVA-E2E.txt
            release-assets/OVA-FAILURE-DIAGNOSTICS.txt
            release-assets/QEMU-SERIAL.txt
            release-assets/QEMU-MONITOR.txt
            release-assets/QEMU-DISK.json
            release-assets/QEMU-SCREEN.ppm
            release-assets/SSH-HOSTKEYS.txt
          if-no-files-found: warn
          retention-days: 30
