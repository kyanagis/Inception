name: Released OVA Import Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build Universal Inception OVA"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ova-release-smoke.yml"

concurrency:
  group: released-ova-import-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  import:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11

      - name: Download published ova-latest assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download ova-latest --repo "$GH_REPO" --dir release-assets             --pattern 'inception.ova.part-*'             --pattern 'SHA256SUMS'             --pattern 'BUILD-PROVENANCE.txt'             --pattern 'OVA-CAPABILITIES.txt'
          test -s release-assets/inception.ova.part-00
          test -s release-assets/inception.ova.part-01
          test -s release-assets/SHA256SUMS

      - name: Verify release provenance matches ova-latest tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source_sha="$(sed -n 's/^OVA source commit: //p' release-assets/BUILD-PROVENANCE.txt)"
          test -n "$source_sha"
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/ova-latest" --jq '.object.sha')"
          test "$source_sha" = "$tag_sha"
          printf 'Published OVA provenance matches tag: %s\n' "$source_sha"

      - name: Reassemble and verify published OVA
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          cat inception.ova.part-* > inception.ova
          expected="$(awk '$2 == "inception.ova" {print $1}' SHA256SUMS)"
          test -n "$expected"
          actual="$(sha256sum inception.ova | awk '{print $1}')"
          test "$actual" = "$expected"
          sha256sum --check --ignore-missing SHA256SUMS

      - name: Import published OVA and boot its disk
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/vbox-home"
          mkdir -p "$HOME"

          # First prove the released appliance imports as an actual VirtualBox
          # appliance. GitHub-hosted runners do not provide vboxdrv, so boot the
          # exact released VMDK with their available KVM accelerator afterwards.
          nix shell nixpkgs#virtualbox --command bash -euo pipefail -c '
            vm="InceptionReleaseSmoke"
            cleanup() {
              VBoxManage unregistervm "$vm" --delete >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            VBoxManage import release-assets/inception.ova --vsys 0 --vmname "$vm"
            VBoxManage showvminfo "$vm" --machinereadable > release-assets/VBOX-IMPORT.txt
            grep -Fq "name=\"$vm\"" release-assets/VBOX-IMPORT.txt
            grep -Eq "^memory=4096$" release-assets/VBOX-IMPORT.txt
            grep -Eq "^cpus=4$" release-assets/VBOX-IMPORT.txt
          '

          mkdir -p release-assets/boot-disk
          tar -xf release-assets/inception.ova -C release-assets/boot-disk
          disk="$(find release-assets/boot-disk -maxdepth 1 -type f -name '*.vmdk' -print -quit)"
          test -n "$disk"

          nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#socat --command bash -euo pipefail -c '
            disk="$1"
            pidfile="$RUNNER_TEMP/inception-qemu.pid"
            serial="$GITHUB_WORKSPACE/release-assets/QEMU-SERIAL.txt"
            monitor="$RUNNER_TEMP/inception-qemu.monitor"
            monitor_log="$GITHUB_WORKSPACE/release-assets/QEMU-MONITOR.txt"
            screen="$GITHUB_WORKSPACE/release-assets/QEMU-SCREEN.ppm"

            dump_state() {
              {
                printf "info status\n"
                printf "info block\n"
                printf "info pci\n"
                printf "screendump %s\n" "$screen"
              } | socat - "UNIX-CONNECT:$monitor" > "$monitor_log" 2>&1 || true
            }

            cleanup() {
              if [ -s "$pidfile" ]; then
                pid="$(cat "$pidfile")"
                kill "$pid" >/dev/null 2>&1 || true
                for _ in $(seq 1 30); do
                  kill -0 "$pid" >/dev/null 2>&1 || break
                  sleep 1
                done
                kill -9 "$pid" >/dev/null 2>&1 || true
              fi
            }
            trap cleanup EXIT

            qemu-system-x86_64 \
              -enable-kvm \
              -machine pc,accel=kvm \
              -cpu host \
              -m 4096 \
              -smp 4 \
              -device ich9-ahci,id=sata \
              -drive "file=$disk,format=vmdk,if=none,id=osdisk,cache=none" \
              -device ide-hd,drive=osdisk,bus=sata.0 \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              -boot order=c,menu=off \
              -display none \
              -serial "file:$serial" \
              -monitor "unix:$monitor,server=on,wait=off" \
              -daemonize \
              -pidfile "$pidfile"

            booted=0
            for attempt in $(seq 1 90); do
              if ssh-keyscan -T 1 -p 2222 127.0.0.1 > "$GITHUB_WORKSPACE/release-assets/SSH-HOSTKEYS.txt" 2>/dev/null &&
                 test -s "$GITHUB_WORKSPACE/release-assets/SSH-HOSTKEYS.txt"; then
                booted=1
                break
              fi
              kill -0 "$(cat "$pidfile")" >/dev/null 2>&1 || {
                echo "QEMU exited before sshd became reachable" >&2
                dump_state
                cat "$serial" >&2 || true
                cat "$monitor_log" >&2 || true
                exit 1
              }
              sleep 1
            done
            if [ "$booted" -ne 1 ]; then
              echo "Published OVA did not reach sshd within the boot budget" >&2
              dump_state
              cat "$serial" >&2 || true
              cat "$monitor_log" >&2 || true
              exit 1
            fi
            printf "Published OVA booted to sshd through KVM.\n" | tee "$GITHUB_WORKSPACE/release-assets/QEMU-BOOT.txt"
          ' bash "$disk"

      - name: Publish import evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ova-release-import-evidence
          path: |
            release-assets/BUILD-PROVENANCE.txt
            release-assets/OVA-CAPABILITIES.txt
            release-assets/VBOX-IMPORT.txt
            release-assets/QEMU-BOOT.txt
            release-assets/QEMU-SERIAL.txt
            release-assets/QEMU-MONITOR.txt
            release-assets/QEMU-SCREEN.ppm
            release-assets/SSH-HOSTKEYS.txt
          if-no-files-found: warn
          retention-days: 30
